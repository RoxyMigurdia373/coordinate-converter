<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f7">
  <title>坐标转换</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#192526;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}main{max-width:440px;margin:0 auto;padding:30px 20px max(20px,env(safe-area-inset-bottom))}header{margin-bottom:24px}h1{font-size:26px;letter-spacing:-1px;margin:0 0 6px}header p{font-size:13px;color:#778181;margin:0}.coordinate{border:1px solid #e3e8e7;border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;font-weight:650}.label span{font-size:11px;font-weight:500;color:#84908f;letter-spacing:1px}select{border:0;background:transparent;color:#586965;font-size:12px;padding:3px}.fields{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}.field{display:flex;align-items:center;background:#f4f6f6;border:2px solid transparent;border-radius:10px;padding:10px 8px;min-width:0}.field:focus-within{background:#eff9f5;border-color:#219a77}.field input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:23px;font-weight:550;color:#192526;text-align:center;padding:0;caret-color:#168764}.field span{font-size:14px;color:#84908f}.result{background:#183f36;color:white;border-radius:18px;padding:17px;margin:18px 0 16px}.result-top{display:flex;align-items:center;justify-content:space-between;color:#afc8c0;font-size:12px}.result select{color:#d7e9e3}.result option{color:#192526;background:white}#result{display:block;width:100%;background:transparent;border:0;outline:0;color:white;font-size:clamp(19px,5.7vw,27px);font-weight:600;letter-spacing:-.5px;padding:17px 0 16px;font-variant-numeric:tabular-nums}#copy{border:0;width:100%;border-radius:9px;background:#e0f2eb;color:#184b3b;padding:11px;font-size:14px;font-weight:650}#copy:disabled{opacity:.4;cursor:default}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.keypad button{border:1px solid #e0e5e4;border-radius:13px;background:#fff;min-height:57px;font-size:25px;color:#253532;box-shadow:0 2px 2px #20352c04}.keypad button:active{background:#dceee6;transform:translateY(1px)}.keypad .utility{background:#e7ecea;font-size:15px;border-color:transparent}.keypad .next{background:#238263;color:#fff;border:0;font-size:16px;font-weight:600}.status{min-height:21px;margin:10px 0 0;font-size:12px;color:#687b73;text-align:center}.status.error{color:#b13e33}button:focus-visible,select:focus-visible{outline:3px solid #66b79d;outline-offset:2px}@media(min-width:600px){main{margin:32px auto;padding:28px;background:#f8faf9;border:1px solid #e2e8e5;border-radius:28px;box-shadow:0 15px 60px #263c3510}}@media(max-height:740px){main{padding-top:16px}header{margin-bottom:16px}.coordinate{padding:12px}.result{margin:12px 0}.keypad button{min-height:46px}}
    .paste-input{display:block;width:100%;margin:0 0 10px;padding:9px 10px;border:1px solid #e1e8e4;border-radius:8px;background:#fff;color:#334b41;font-size:14px;outline:none}.paste-input:focus{border-color:#219a77}.paste-input::placeholder{color:#929e98;font-size:12px}
  </style>
</head>
<body>
<main>
  <header><h1>坐标转换</h1><p>度分秒 → 十进制度</p></header>
  <section class="coordinate" aria-label="经度">
    <div class="label">经度 <select id="lon-direction" aria-label="经度方向"><option value="1">东经 E</option><option value="-1">西经 W</option></select></div>
    <input class="paste-input" data-axis="0" aria-label="粘贴经度或整组度分秒坐标" placeholder="可长按粘贴经度，例如 107°53′15.40″" autocomplete="off" spellcheck="false">
    <div class="fields">
      <label class="field"><input id="lon-d" aria-label="经度 度" inputmode="none" readonly placeholder="度"><span>°</span></label>
      <label class="field"><input id="lon-m" aria-label="经度 分" inputmode="none" readonly placeholder="分"><span>′</span></label>
      <label class="field"><input id="lon-s" aria-label="经度 秒" inputmode="none" readonly placeholder="秒"><span>″</span></label>
    </div>
  </section>
  <section class="coordinate" aria-label="纬度">
    <div class="label">纬度 <select id="lat-direction" aria-label="纬度方向"><option value="1">北纬 N</option><option value="-1">南纬 S</option></select></div>
    <input class="paste-input" data-axis="1" aria-label="粘贴纬度或整组度分秒坐标" placeholder="可长按粘贴纬度，例如 37°34′33.92″" autocomplete="off" spellcheck="false">
    <div class="fields">
      <label class="field"><input id="lat-d" aria-label="纬度 度" inputmode="none" readonly placeholder="度"><span>°</span></label>
      <label class="field"><input id="lat-m" aria-label="纬度 分" inputmode="none" readonly placeholder="分"><span>′</span></label>
      <label class="field"><input id="lat-s" aria-label="纬度 秒" inputmode="none" readonly placeholder="秒"><span>″</span></label>
    </div>
  </section>
  <section class="result" aria-label="转换结果">
    <div class="result-top">十进制经纬度 <select id="precision" aria-label="保留小数位数"><option value="3">3 位小数</option><option value="4">4 位小数</option><option value="5">5 位小数</option><option value="6">6 位小数</option></select></div>
    <input id="result" aria-label="可复制的十进制经纬度" readonly placeholder="等待输入" style="--placeholder:white">
    <button id="copy" disabled>复制坐标</button>
  </section>
  <div class="keypad" aria-label="数字键盘">
    <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
    <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
    <button data-key=".">.</button><button data-key="0">0</button><button data-key="backspace" aria-label="删除一位">⌫</button>
    <button class="utility" data-key="clear">全部清空</button><button class="utility" data-key="clear-field">清空本项</button><button class="next" data-key="next">下一项 →</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">依次输入度、分、秒，自动转换</p>
</main>
<script>
  const fields = [...document.querySelectorAll('.field input')];
  const result = document.querySelector('#result');
  const copy = document.querySelector('#copy');
  const status = document.querySelector('#status');
  let active = 0;
  fields.forEach((field, index) => field.addEventListener('focus', () => { active = index; }));
  function message(text, error = false) { status.textContent = text; status.classList.toggle('error', error); }
  function coordinate(values, limit, name) {
    const [d,m,s] = values.map(Number);
    if (!values.every(v => /^\d+(\.\d*)?$/.test(v))) throw new Error('请输入有效数字');
    if (!Number.isInteger(d) || !Number.isInteger(m)) throw new Error(name + '的度、分须为整数');
    if (m >= 60 || s >= 60) throw new Error(name + '的分、秒必须小于 60');
    if (d > limit || (d === limit && (m !== 0 || s !== 0))) throw new Error(name + '不能超过 ' + limit + '°');
    return d + m / 60 + s / 3600;
  }
  function update() {
    copy.textContent = '复制坐标'; result.value = ''; copy.disabled = true;
    if (fields.some(f => f.value === '')) { message('依次输入度、分、秒，自动转换'); return; }
    try {
      const lon = coordinate(fields.slice(0,3).map(f => f.value),180,'经度') * Number(document.querySelector('#lon-direction').value);
      const lat = coordinate(fields.slice(3).map(f => f.value),90,'纬度') * Number(document.querySelector('#lat-direction').value);
      const precision = Number(document.querySelector('#precision').value);
      const format = value => { const rounded = value.toFixed(precision); return Number(rounded) === 0 ? (0).toFixed(precision) : rounded; };
      result.value = format(lon) + ',' + format(lat); copy.disabled = false;
      message('已转换 · 经度在前，纬度在后');
    } catch (error) { message(error.message,true); }
  }
  function key(value) {
    const field = fields[active];
    if (value === 'next') { active = (active + 1) % fields.length; }
    else if (value === 'clear') { fields.forEach(f => f.value = ''); document.querySelectorAll('.paste-input').forEach(f => f.value = ''); active = 0; }
    else if (value === 'clear-field') field.value = '';
    else if (value === 'backspace') field.value = field.value.slice(0,-1);
    else if (value === '.') {
      if (active % 3 !== 2) { message('度和分填写整数，小数请填在秒中',true); return; }
      if (!field.value.includes('.')) field.value = (field.value || '0') + '.';
    } else if (/^\d$/.test(value) && field.value.length < 12) field.value += value;
    fields[active].focus({preventScroll:true}); update();
  }
  document.querySelectorAll('[data-key]').forEach(button => {
    button.addEventListener('mousedown', event => event.preventDefault());
    button.addEventListener('click', () => key(button.dataset.key));
  });
  fields.forEach(field => field.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const value = event.key;
    if (/^[\d.]$/.test(value)) { event.preventDefault(); key(value); }
    else if (value === 'Backspace' || value === 'Delete') { event.preventDefault(); key(value === 'Backspace' ? 'backspace' : 'clear-field'); }
    else if (value === 'Enter') { event.preventDefault(); key('next'); }
  }));
  fields.forEach(field => field.addEventListener('paste', event => {
    event.preventDefault();
    const text = event.clipboardData.getData('text').trim();
    if (/^\d+(\.\d*)?$/.test(text) && text.length <= 12) { field.value = text; update(); }
    else message('每一项分别填写数字，例如：107、53、15.40',true);
  }));
  function parseDms(text) {
    const normalized = text.trim().replace(/[°º度′’‘'分″“”\"秒]/g,' ').replace(/\s+/g,' ').trim();
    const match = normalized.match(/^([+-]?\d+) (\d+) (\d+(?:\.\d+)?)$/);
    if (!match) throw new Error('请粘贴度分秒坐标，例如 107°53′15.40″');
    return {values:[String(Math.abs(Number(match[1]))),match[2],match[3]],negative:match[1].startsWith('-')};
  }
  document.querySelectorAll('.paste-input').forEach(input => input.addEventListener('input', () => {
    if (!input.value.trim()) return;
    try {
      const parts = input.value.trim().split(/[,，;；\r\n]+/).map(s => s.trim()).filter(Boolean);
      if (parts.length > 2) throw new Error('请按经度、纬度的顺序粘贴，使用逗号分隔');
      const parsed = parts.map(parseDms);
      parsed.forEach((item,index) => {
        const axis = parts.length === 2 ? index : Number(input.dataset.axis);
        coordinate(item.values,axis === 0 ? 180 : 90,axis === 0 ? '经度' : '纬度');
      });
      parsed.forEach((item,index) => {
        const axis = parts.length === 2 ? index : Number(input.dataset.axis);
        item.values.forEach((value,i) => fields[axis * 3 + i].value = value);
        document.querySelector(axis === 0 ? '#lon-direction' : '#lat-direction').value = item.negative ? '-1' : '1';
      });
      update();
    } catch (error) { result.value = ''; copy.disabled = true; message(error.message,true); }
  }));
  document.querySelectorAll('select').forEach(select => select.addEventListener('change',update));
  result.addEventListener('click', () => result.select());
  copy.addEventListener('click', async () => {
    if (!result.value) return;
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(result.value);
      else { result.select(); if (!document.execCommand('copy')) throw new Error('copy'); }
      copy.textContent = '已复制 ✓'; message('坐标已复制');
    } catch { result.focus(); result.select(); message('请长按结果或按 Ctrl+C 复制'); }
  });
  fields[0].focus({preventScroll:true});
</script>
</body>
</html>
